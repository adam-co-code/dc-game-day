# Refreshes events.json from the NHL, MLB and ESPN schedule feeds every morning.
# Each run's log and summary are under the repo's Actions tab. To run it now:
# Actions → "Update schedule" → "Run workflow".
name: Update schedule

on:
  schedule:
    - cron: "23 10 * * *"  # daily at 10:23 UTC (6:23 AM Eastern in summer, 5:23 AM in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest schedules
        run: |
          cp events.json "$RUNNER_TEMP/previous.json"
          python3 scripts/update.py

      # Ticket lookups never block the schedule update: if this step fails,
      # the run carries on and the previous ticket links are kept.
      - name: Look up ticket links and prices
        continue-on-error: true
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
        run: python3 scripts/tickets.py

      - name: Check the new file before publishing
        run: python3 scripts/validate.py events.json --previous "$RUNNER_TEMP/previous.json"

      - name: Publish
        run: |
          if git diff --quiet events.json; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Daily schedule update"
          # Retry a few times: GitHub occasionally rejects a push with a temporary server error
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed; retrying in $((i * 10)) seconds"; sleep $((i * 10))
          done
          exit 1
